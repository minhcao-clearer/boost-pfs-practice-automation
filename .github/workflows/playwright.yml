name: CI
on:
  push:
    branches: [main, master, "pw-practice-**"]
  pull_request:
    branches: [main, master]
jobs:
  # Fast, deterministic gate: type-check, lint and formatting.
  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # .env is gitignored, so CI supplies BASE_URL here. The demo storefront is public
    # and fixed, so it is plain config — not a secret. Point it elsewhere by editing
    # this line (or switch to a repo variable if it ever becomes environment-specific).
    env:
      BASE_URL: https://boost-pfs-demo.myshopify.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
